name: UTA Preview Quality
on:
  push:
    branches:
      - preview/uta-cinematic-2026
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: file:./dev.db
      - run: npx prisma validate --schema prisma/schema.postgres.prisma
        env:
          DATABASE_URL: postgresql://preview:preview@localhost:5432/uta_preview
      - run: npx tsc --noEmit
        env:
          DATABASE_URL: file:./dev.db
      - run: npm run build
        env:
          DATABASE_URL: file:./dev.db
          SESSION_SECRET: preview-only-ci-fake-secret-32-characters-minimum-not-for-runtime
